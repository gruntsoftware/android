[bundles]
androidx-lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel", "androidx-lifecycle-viewmodel-compose"]
androidx-navigation = ["androidx-navigation-fragment", "androidx-navigation-ui"]
firebase = ["firebase-analytics", "firebase-crashlytics", "firebase-crashlytics-ndk", "firebase-messaging", "firebase-inappmessaging", "firebase-config"]
google-play-asset-delivery = ["google-play-asset-delivery", "google-play-asset-delivery-ktx"]
google-play-feature-delivery = ["google-play-feature-delivery", "google-play-feature-delivery-ktx"]
google-play-review = ["google-play-review", "google-play-review-ktx"]
eclipse-jetty = ["eclipse-jetty-webapp", "eclipse-jetty-websocket", "eclipse-jetty-continuation"]
android-test = ["androidx-test-core", "androidx-test-core-ktx", "androidx-test-rules","androidx-test-espresso-core", "androidx-test-junit-ext","androidx-test-juniext-ext-ktx", "androidx-test-runner", "androidx-test-uiautomator"]
squareup-retrofit = ["squareup-retrofit", "squareup-retrofit-kotlinx-serialization-json"]
squareup-okhttp = ["squareup-okhttp", "squareup-okhttp-logging-interceptor"]

[plugins]
jetbrains-kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version = "2.1.0" }
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.2" }
