name: Auto-Translate strings.xml

on:
  push:
    branches:
      - bento
      - develop
    paths:
      - '**/values/strings.xml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DEVELOP
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TRANSLATION_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic lxml requests

      - name: Run translation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/translate_strings.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create branch and commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="translations/auto-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/src/main/res/values-*/strings.xml
          git commit -m "chore(i18n): auto-translate missing strings [skip ci]

          Languages updated: ar, zh-rTW, zh-rCN, fr, de, fa, pa, pl, in, es, sv, uk, ru, tr, ja, ko, hi, it, pt-rBR
          Triggered by: ${{ github.sha }}
          "
          git push origin "$BRANCH"

      - name: Open Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PAT }}
        run: |
          gh pr create \
            --title "🌍 Auto-translations: missing strings updated" \
            --body "$(cat /tmp/pr_body.md)" \
            --base main \
            --head "$BRANCH" \
            --label "translations" \
            --reviewer "${{ github.actor }}"
