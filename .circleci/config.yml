# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  android: circleci/android@3.1.0
  ruby: circleci/ruby@2.5.3

# Define reusable commands
commands:
  setup_environment:
    description: "Sets up the basic environment for all jobs (checkout, credentials, submodules)"
    steps:
      - checkout
      - android/restore_gradle_cache
      - run:
          name: "Setup environment..."
          command: "echo Setting up environment for brainwallet-android!"
      - run:
          name: "Create google-services.json from env"
          command: |
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            ls -la app/google-services.json
      - run:
          name: "create service-data.json from env"
          command: |
            mkdir -p app/src/main/assets
            echo "$SERVICE_DATA_JSON" | base64 --decode > app/src/main/assets/service-data.json
            ls -la app/src/main/assets/service-data.json
      - run:
          name: "Create keystore files from env"
          command: |
            echo "$DEBUG_STORE_FILE" | base64 --decode > debug.keystore
            echo "$RELEASE_STORE_FILE" | base64 --decode > release.keystore
            ls -la *.keystore
      - run:
          name: "Create local.properties file"
          command: |
            cat > local.properties \<< EOL
            #adjust with your location
            DEBUG_STORE_FILE=${CIRCLE_WORKING_DIRECTORY}/debug.keystore
            DEBUG_STORE_PASSWORD=${DEBUG_STORE_PASSWORD}
            DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS}
            DEBUG_KEY_PASSWORD=${DEBUG_KEY_PASSWORD}

            #adjust with your location
            RELEASE_STORE_FILE=${CIRCLE_WORKING_DIRECTORY}/release.keystore
            RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
            RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
            RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}

            # screengrab paperkey
            SCREENGRAB_PAPERKEY=${SCREENGRAB_PAPERKEY}
            EOL
            ls && cat local.properties
      - run:
          name: Rewrite .gitmodules with token
          command: |
            sed -i "s#https://github.com/#https://${GH_TOKEN}@github.com/#g" .gitmodules
            git submodule sync --recursive
            git submodule update --init --recursive

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  unit-test:
    executor:
      name: android/android_docker
      tag: 2024.07.1-ndk
      resource_class: large
    environment:
      # Lowered from -Xmx4g/workers.max=2: the Gradle daemon heap plus forked
      # unit-test worker JVMs plus OS/container overhead were exceeding the
      # `large` resource class's available RAM, causing the daemon to be
      # OOM-killed mid-build ("daemon has disappeared"). Reducing the daemon
      # heap and worker parallelism leaves more headroom for the AGP-forked
      # test JVMs without changing the resource class.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1"
    steps:
      - setup_environment
      - run:
          name: "Execute Unit Tests"
          # -x detekt: android-build-logic's DetektSetup.attachDetektTask() wires
          # `detekt` (autoCorrect=true, parallel=true, HTML/XML/TXT/SARIF/MD reports)
          # as a dependency of every compile*/assemble* task project-wide, so a plain
          # test run was also paying for 3-4 full static-analysis passes it doesn't
          # need — real CPU/memory competing with compilation and the forked test
          # JVMs on this resource-constrained executor. Excluding it here only
          # affects this CI job, not local dev/lint workflows.
          command: ./gradlew testBrainwalletDebugUnitTest --no-daemon --max-workers=1 -x detekt
      - android/save_gradle_cache
      - run:
          name: Save test results
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - store_test_results:
          path: ~/test-results
      - store_artifacts:
          path: ~/test-results/junit
      - run:
          name: "Update tests-passed badge (shields.io gist endpoint)"
          # Only the primary branch's run should own the badge state - a feature
          # branch with fewer/broken tests shouldn't flap the README badge.
          # Requires GIST_TOKEN (a PAT with only the `gist` scope) and GIST_ID
          # to be set as CircleCI project env vars.
          when: always
          command: |
            if [ "$CIRCLE_BRANCH" != "develop" ]; then
              echo "Not on develop, skipping badge update."
              exit 0
            fi
            if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
              echo "GIST_TOKEN/GIST_ID not set, skipping badge update."
              exit 0
            fi

            total=0
            failures=0
            skipped=0
            for f in ~/test-results/junit/*.xml; do
              [ -f "$f" ] || continue
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              sk=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              total=$((total + ${t:-0}))
              failures=$((failures + ${fl:-0}))
              skipped=$((skipped + ${sk:-0}))
            done
            passed=$((total - failures - skipped))

            if [ "$failures" -gt 0 ]; then
              message="${passed} passed, ${failures} failed"
              color="red"
            else
              message="${passed} passed"
              color="brightgreen"
            fi

            payload=$(printf '{"files":{"tests-badge.json":{"content":"{\\"schemaVersion\\":1,\\"label\\":\\"tests\\",\\"message\\":\\"%s\\",\\"color\\":\\"%s\\"}"}}}' "$message" "$color")

            curl -s -X PATCH \
              -H "Authorization: token ${GIST_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/gists/${GIST_ID}" \
              -d "$payload" > /dev/null

            echo "Badge updated: ${message}"

  screengrab:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - setup_environment
      - ruby/install:
          version: '3.2.0'
      - ruby/install-deps
      - run:
          name: "Install fastlane"
          command: |
            gem install bundler
            bundle install
      - android/create_avd:
          avd_name: bw_avd
          install: true
          system_image: system-images;android-34;google_apis;x86_64
          additional_args: '-d "pixel_7_pro"'
      - android/start_emulator:
          avd_name: bw_avd
          no_window: true
          memory: 4096
          delay_adb: true
          run_logcat: true
          # additional_args: "-skin 1080x1920 -memory 2048"
          post_emulator_launch_assemble_command: |
            # bundle exec fastlane android build_and_screengrab
            echo "skipping assemble command, as we only need the emulator running for screengrab"
      - run:
          name: "Wait for emulator to boot and set PIN"
          command: |
            echo "Waiting for emulator to boot..."
            timeout 300 sh -c 'until adb shell getprop sys.boot_completed | grep -m 1 "1"; do sleep 5; done'
            echo "Emulator is ready!"
            adb shell svc power stayon true
            adb shell locksettings set-pin 123456
            adb shell input keyevent 82
            sleep 5
      - run:
          name: "Run Screengrab"
          command: |
            bundle exec fastlane android build_and_screengrab
      - run:
          name: "List fastlane android contents"
          command: ls -R fastlane/android/
      - android/save_gradle_cache
      - store_artifacts:
          path: fastlane/metadata/android/
          destination: android-screenshots

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  test-and-build:
    jobs:
      - unit-test
